<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발표 AI 코칭</title><style>body{font:16px system-ui;max-width:850px;margin:30px auto;padding:20px;background:#f3f6fb;color:#142b4c}input,select,button{padding:12px;font:inherit;max-width:100%;margin:8px 0}article{background:white;border:1px solid #dce4f0;border-radius:12px;padding:20px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}blockquote{white-space:pre-wrap}</style><a href="/">← 기존 앱</a><h1>발표 AI 코칭</h1><p>기존 앱에서 저장한 연습을 선택하세요. 원본 파일·녹음은 보내지 않고, 해당 세션의 자료 텍스트·전사문·설정만 Gemini로 전송합니다. 무료 서비스 데이터 이용 조건이 적용됩니다.</p><select id="sessions" aria-label="연습 선택"></select><p id="info"></p><label>시연 암호 <input id="token" type="password" autocomplete="off"></label><p><label><input id="consent" type="checkbox"> 선택한 텍스트의 외부 전송에 동의</label></p><button id="run">실제 코칭 요청</button> <button id="save" hidden>결과 저장 재시도 (API 재호출 없음)</button><pre id="status" role="status">불러오는 중</pre><div id="cards"></div><script>
const $=id=>document.getElementById(id);let db,list=[],pending=null,busy=false;
function records(){return new Promise((resolve,reject)=>{const r=db.transaction('sessions').objectStore('sessions').getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function render(cards){$('cards').replaceChildren();if(!cards.length){$('cards').textContent='근거가 충분한 개선 카드가 없습니다. 오류는 아닙니다.';return;}for(const c of cards){const a=document.createElement('article');for(const [tag,text] of [['h2',c.slide+'번 슬라이드'],['p',c.issue],['blockquote','자료: '+c.sourceQuote],['blockquote','발언: '+c.spokenQuote],['p','제안: '+c.suggestion]]){const n=document.createElement(tag);n.textContent=text;a.append(n);}$('cards').append(a);}}
function select(){const s=list.find(x=>x.id===$('sessions').value);$('info').textContent=s?'자료 '+(s.material?.slides?.length||0)+'장 · 전사 '+(s.transcript?.text?.length||0)+'자':'';if(s?.coaching?.cards)render(s.coaching.cards);else $('cards').replaceChildren();}
async function save(){if(!pending)return;const p=pending;await new Promise((resolve,reject)=>{const tx=db.transaction('sessions','readwrite'),store=tx.objectStore('sessions'),r=store.get(p.id);r.onsuccess=()=>{const s=r.result;if(!s||s.transcript?.text!==p.transcript||JSON.stringify(s.material?.slides)!==p.slides){tx.abort();return;}s.coaching={...p.result,transcriptRevision:s.transcript?.revision||0,createdAt:new Date().toISOString()};store.put(s);};tx.oncomplete=resolve;tx.onabort=()=>reject(Error('저장 실패 또는 자료·전사문이 변경됐습니다.'));tx.onerror=()=>{};});pending=null;$('save').hidden=true;$('status').textContent='AI 코칭 및 세션 저장 완료. 기존 앱에서 같은 세션을 다시 열면 결과를 확인할 수 있습니다.';list=await records();}
$('save').onclick=async()=>{try{await save();}catch(e){$('status').textContent=e.message;}};
$('sessions').onchange=()=>{if(pending){$('status').textContent='미저장 결과부터 저장하세요.';return;}select();};
$('run').onclick=async()=>{if(busy||pending)return;const s=list.find(x=>x.id===$('sessions').value);if(!s?.transcript?.text||!s.material?.slides?.length){$('status').textContent='슬라이드와 전사문이 저장된 세션을 선택하세요.';return;}if(!$('consent').checked||!$('token').value){$('status').textContent='동의와 시연 암호가 필요합니다.';return;}if(!/^[\x20-\x7e]+$/.test($('token').value)){$('status').textContent='시연 암호는 기존 영문·숫자 암호를 사용하세요.';return;}busy=true;$('run').disabled=true;$('sessions').disabled=true;const start=performance.now();$('status').textContent='실제 AI 코칭 중 · 최대 약 50초. 자동 재시도하지 않습니다.';try{const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json','x-demo-token':$('token').value},body:JSON.stringify({consent:true,slides:s.material.slides,transcript:s.transcript.text,settings:{goal:s.material.goal,audience:s.material.audience,targetMinutes:s.material.targetMinutes}}),signal:AbortSignal.timeout(65000)});const result=await r.json();if(!r.ok)throw Error((result.code||r.status)+': '+result.message);if(!Array.isArray(result.cards))throw Error('카드 응답 오류');render(result.cards);pending={id:s.id,transcript:s.transcript.text,slides:JSON.stringify(s.material.slides),result};$('save').hidden=false;try{await save();$('status').textContent+=' · '+Math.round((performance.now()-start)/1000)+'초';}catch(e){$('status').textContent='결과 수신 성공, 저장 실패. 재요청하지 말고 저장 재시도를 누르세요. '+e.message;}}catch(e){$('status').textContent='코칭 실패: '+e.message;}finally{busy=false;$('run').disabled=false;$('sessions').disabled=false;$('token').value='';}};
const request=indexedDB.open('rehearsal-coach-sessions');let missing=false;request.onupgradeneeded=()=>{missing=true;request.transaction.abort();};request.onerror=()=>{$('status').textContent=missing?'이 주소에 연습 데이터가 없습니다. 기존 앱에서 먼저 자료와 전사문을 저장하세요.':'저장소 열기 실패';};request.onsuccess=async()=>{db=request.result;if(!db.objectStoreNames.contains('sessions')){$('status').textContent='기존 앱에서 세션을 먼저 만드세요.';return;}try{list=(await records()).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));for(const s of list){const o=document.createElement('option');o.value=s.id;o.textContent=(s.material?.name||'연습')+' · '+new Date(s.createdAt).toLocaleString();$('sessions').append(o);}select();$('status').textContent=list.length?'준비 완료. 짧은 자료의 세션부터 테스트하세요.':'저장된 세션이 없습니다.';}catch(e){$('status').textContent='세션 읽기 실패';}};
window.addEventListener('beforeunload',e=>{if(pending||busy){e.preventDefault();e.returnValue='';}});
</script></html>
