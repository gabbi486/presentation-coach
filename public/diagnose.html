<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 연결 검사</title><style>body{font:17px system-ui;max-width:720px;margin:40px auto;padding:20px;background:#f3f6f5;color:#172a38}input,button{padding:12px;font:inherit;max-width:100%;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}</style><h1>AI 연결 검사</h1><p>기존 시연 암호를 입력하세요. API 키를 넣지 마세요. 녹음·자료·전사문은 보내지 않습니다. 서버의 모델 조회 후 고정된 짧은 문장 1회를 요청합니다. 무료 한도를 사용할 수 있으며 약 40초 이내에 결과가 나옵니다.</p><label>시연 암호 <input id="token" type="password" autocomplete="off"></label><br><button id="go">연결 검사 1회 실행</button><pre id="out" role="status">대기 중</pre><p><a href="/">앱으로 돌아가기</a></p><script>const go=document.getElementById('go'),out=document.getElementById('out'),token=document.getElementById('token');go.onclick=async()=>{if(!token.value){out.textContent='시연 암호를 입력하세요.';return;}go.disabled=true;out.textContent='검사 중…';try{const r=await fetch('/api/diagnose',{method:'POST',headers:{'Content-Type':'application/json','x-demo-token':token.value},body:'{}',signal:AbortSignal.timeout(45000)});let data;try{data=await r.json();}catch{throw Error('진단 API가 아직 반영되지 않았거나 서버 응답이 올바르지 않습니다.');}out.textContent=JSON.stringify(data,null,2);}catch(e){out.textContent='검사 실패: '+e.message;}finally{go.disabled=false;token.value='';}};</script></html>
