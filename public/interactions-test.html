<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactions 최소 검사</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:20px}input,button{font:inherit;padding:12px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef3f9;padding:20px}</style><h1>Interactions API 최소 연결 검사</h1><p>기존 앱과 별도입니다. 녹음·슬라이드·전사문을 보내지 않습니다. 고정 문장 1회를 Gemini에 요청하며 무료 할당량을 사용할 수 있습니다. 요청에 store:false를 지정하지만 서비스의 로그·데이터 정책 전체를 해제하는 것은 아닙니다.</p><label>기존 시연 암호 <input id="token" type="password" autocomplete="off"></label><p><label><input id="consent" type="checkbox"> 고정 문장 외부 전송에 동의합니다.</label></p><button id="go">최소 연결 검사 1회</button><pre id="out" role="status">대기 중</pre><a href="/">기존 앱</a><script>const go=document.getElementById('go'),token=document.getElementById('token'),consent=document.getElementById('consent'),out=document.getElementById('out');go.onclick=async()=>{if(!token.value||!consent.checked){out.textContent='시연 암호와 동의를 확인하세요. API 키를 입력하지 마세요.';return;}go.disabled=true;out.textContent='검사 중 · 최대 약 40초';try{const r=await fetch('/api/interactions-test',{method:'POST',headers:{'Content-Type':'application/json','x-demo-token':token.value},body:JSON.stringify({consent:true}),signal:AbortSignal.timeout(50000)});out.textContent=JSON.stringify(await r.json(),null,2);}catch(e){out.textContent='서버 응답 확인 실패: '+e.message;}finally{token.value='';go.disabled=false;}};</script></html>
